<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <!-- La agenda es una pantalla de login: indexarla da un resultado de
         búsqueda "Mi agenda — Hacelo Ya" sin descripción, apuntando a un
         formulario. El 404 ya tenía noindex y esto no. Hallazgo H-W1-18.
         El `lang` decía "es" mientras el resto del sitio dice "es-AR"
         (H-W1-20). -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi agenda — Hacelo Ya</title>
    <!-- LAS TIPOGRAFÍAS DE LA MARCA.
         `theme.css` las pedía (`font-family: 'Manrope'` y `'Archivo Black'`) y
         nadie las cargaba nunca: toda la agenda caía al fallback del sistema,
         mientras la landing —que las carga bien, tres archivos más allá— se
         veía con la tipografía de la marca. Dos páginas del mismo sitio con
         dos identidades distintas. Hallazgo H-W1-07. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Cloudflare Web Analytics. Instalación MANUAL a propósito: el modo
       automático inyecta el script sólo en el HTML que sirve Cloudflare, y
       este sitio está en GitHub Pages con el DNS sin proxear, así que ese
       camino nunca se dispararía. `defer` para que no frene el pintado. -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "005bccf9f08f44818ec7dd2b75470409"}'></script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
