<script type="module">
  // Si ya hay una sesión iniciada (misma cuenta que la app), no tiene sentido
  // mostrarle esta página de nuevo: se lo manda directo a su agenda. Se
  // oculta la página hasta resolver esto (con un timeout de seguridad) para
  // evitar el flash de este gateway antes de redirigir.
  document.documentElement.style.visibility = 'hidden';
  var revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    document.documentElement.style.visibility = 'visible';
  }
  setTimeout(reveal, 1200);
  try {
    var appMod = await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js');
    var authMod = await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js');
    var app = appMod.initializeApp({
      apiKey: 'AIzaSyDpcOcD9ivZ_KojBg2NJBY475z4X447_MI',
      authDomain: 'haceloyaapp-88e3d.firebaseapp.com',
      projectId: 'haceloyaapp-88e3d',
    });
    var auth = authMod.getAuth(app);
    authMod.onAuthStateChanged(auth, function (user) {
      if (user) {
        location.replace('/agenda/');
      } else {
        reveal();
      }
    });
  } catch (e) {
    reveal();
  }
</script>

<style>
  :root{
    --bg:#FFFFFF;
    --ink:#14140F;
    --yellow:#FFC800;
    --yellow-deep:#E0AC00;
    --blue:#2F80ED;
    --muted:#3D3D35;
    --stripe-w: 34px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-left:var(--stripe-w);
    padding-right:var(--stripe-w);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  h1{
    font-family:'Archivo Black','Manrope',sans-serif;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:inherit;}
  .container{max-width:1120px;margin:0 auto;padding:0 24px;width:100%;}

  .hazard-rail{
    position:fixed; top:0; bottom:0; width:var(--stripe-w); z-index:40;
    background:repeating-linear-gradient(-45deg, var(--ink) 0 18px, var(--yellow) 18px 36px);
    box-shadow: 0 0 0 2px var(--ink) inset;
  }
  .hazard-rail.left{left:0;}
  .hazard-rail.right{right:0;}
  @media (max-width: 860px){ :root{--stripe-w: 14px;} }
  @media (max-width: 520px){ :root{--stripe-w: 9px;} }

  header{
    border-bottom:2px solid var(--ink);
  }
  .nav-wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0;
  }
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .brand-word{font-family:'Archivo Black'; font-size:20px; letter-spacing:-0.02em;}
  nav.links{display:flex; align-items:center; gap:20px;}
  nav.links a{
    text-decoration:none; font-weight:700; font-size:14.5px;
    color:var(--ink);
  }
  nav.links a:hover{color:var(--blue);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-weight:800; font-size:15px;
    border-radius:10px; border:2px solid var(--ink);
    padding:14px 26px; text-decoration:none;
    cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:4px 4px 0 var(--ink);
  }
  .btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .btn-yellow{background:var(--yellow); color:var(--ink);}
  .btn-yellow:hover{background:var(--yellow-deep);}

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:64px 24px;
  }
  .hero-mark{margin-bottom:24px;}
  main h1{font-size:clamp(32px,6vw,52px); margin-bottom:14px;}
  main p{color:var(--muted); font-size:16.5px; margin:0 0 30px;}

  footer{padding:24px 0; border-top:2px solid var(--ink); text-align:center;}
  footer p{margin:4px 0; font-size:12.5px; color:var(--muted);}
  footer a{font-weight:700; text-decoration:none;}
  footer a:hover{color:var(--blue);}

  ::selection{background:var(--yellow); color:var(--ink);}
  :focus-visible{outline:3px solid var(--blue); outline-offset:2px;}
</style>
